[project]
name = "tool-orchestration-hub"
version = "0.2.0"
description = "12ツールを横断する軽量な中継基盤+異常検知アラートHub(監視のみ、各ツールの権限は奪わない)。profiling_toolをサブ機能として同梱する。"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "winotify>=1.1; sys_platform == 'win32'",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
hub = "hub.main:run"
profiling-dashboard = "profiling_tool.dashboard.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub", "profiling_tool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
