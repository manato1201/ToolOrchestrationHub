 0-14 9 9 0 0 1 17-2 7.500 7.500 0 0 1 1 16z"/></g><rect class="card" x="1498.0" y="608.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1510.0 620.0) scale(1.000)"><circle cx="20" cy="13" r="7"/><path d="M6 35c0-8 6-13 14-13s14 5 14 13"/></g><rect class="card" x="608.0" y="828.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 840.0) scale(1.000)"><circle cx="10" cy="8" r="4"/><circle cx="10" cy="32" r="4"/><circle cx="30" cy="16" r="4"/><path d="M10 12v16M30 20c0 6-8 6-18 9"/></g><rect class="card" x="868.0" y="828.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 840.0) scale(1.000)"><path d="M4 10a3 3 0 0 1 3-3h8l4 5h14a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></g><rect class="card" x="1128.0" y="828.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 840.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><text class="title" x="150" y="242.0">http_bridge 系</text><text class="sub mono" x="150" y="261.0">dev_rag_environment</text><text class="sub mono" x="150" y="276.0">profiling_tool</text><text class="title" x="150" y="392.0">rpc 系</text><text class="sub mono" x="150" y="411.0">lore・sound・learning_qt</text><text class="sub mono" x="150" y="426.0">(相手が信号を送る)</text><text class="title" x="150" y="542.0">CI / cron 系</text><text class="sub mono" x="150" y="561.0">the_algorithm・research</text><text class="sub mono" x="150" y="576.0">asset・vrqa</text><text class="title" x="150" y="692.0">アラートの送り手</text><text class="sub mono" x="150" y="711.0">Profiling・VRQA</text><text class="sub mono" x="150" y="726.0">Asset Data Insight</text><text class="title" x="640" y="242.0">registry</text><text class="sub mono" x="640" y="261.0">registry.yaml (12 件)</text><text class="sub mono" x="640" y="276.0">5 秒でホットリロード</text><text class="title" x="1160" y="242.0">alert_store</text><text class="sub mono" x="1160" y="261.0">SQLite (.hub_state/)</text><text class="sub mono" x="1160" y="276.0">解消後 30 日で削除</text><text class="title" x="640" y="467.0">app.py</text><text class="sub mono" x="640" y="486.0">heartbeat・ci-success・</text><text class="sub mono" x="640" y="501.0">アラートの受け口</text><text class="title" x="900" y="467.0">LivenessMonitor</text><text class="sub mono" x="900" y="486.0">http / rpc / ci の</text><text class="sub mono" x="900" y="501.0">3 種の死活監視</text><text class="title" x="1160" y="467.0">AlertAggregator</text><text class="sub mono" x="1160" y="486.0">alert_id で 1 件にまとめる</text><text class="sub mono" x="1160" y="501.0">open → resolved</text><text class="title" x="1160" y="692.0">dashboard</text><text class="sub mono" x="1160" y="711.0">tool_state・overview</text><text class="sub mono" x="1160" y="726.0">状態の決め方は 1 か所</text><text class="title" x="1530" y="467.0">通知</text><text class="sub mono" x="1530" y="486.0">Windows トースト</text><text class="sub mono" x="1530" y="501.0">Slack Webhook</text><text class="title" x="1530" y="692.0">利用者(ブラウザ)</text><text class="sub mono" x="1530" y="711.0">/ は viewer 以上</text><text class="sub mono" x="1530" y="726.0">/admin は admin だけ</text><text class="title" x="640" y="912.0">repo_sync</text><text class="sub mono" x="640" y="931.0">git fetch は自動</text><text class="sub mono" x="640" y="946.0">pull は人が押す</text><text class="title" x="900" y="912.0">13 リポジトリ</text><text class="sub mono" x="900" y="931.0">repos.yaml</text><text class="title" x="1160" y="912.0">process_launcher</text><text class="sub mono" x="1160" y="931.0">固定のコマンドを</text><text class="sub mono" x="1160" y="946.0">新しい窓で開く</text><rect class="lab" x="351.6" y="301.0" width="168.8" height="16" rx="3"/><text class="alabel mono blue" x="436.0" y="313.0">GET /health(Hub から確認)</text><rect class="lab" x="326.9" y="321.0" width="68.1" height="16" rx="3"/><text class="alabel mono blue" x="361.0" y="333.0">heartbeat</text><rect class="lab" x="323.7" y="471.0" width="74.6" height="16" rx="3"/><text class="alabel mono blue" x="361.0" y="483.0">ci-success</text><rect class="lab" x="297.9" y="621.0" width="126.3" height="16" rx="3"/><text class="alabel mono blue" x="361.0" y="633.0">POST /api/alerts/*</text><rect class="lab" x="759.4" y="171.0" width="71.2" height="16" rx="3"/><text class="alabel mono blue" x="795.0" y="183.0">台帳の一覧</text><rect class="lab" x="713.3" y="396.0" width="113.4" height="16" rx="3"/><text class="alabel mono blue" x="770.0" y="408.0">record_heartbeat</text><rect class="lab" x="995.9" y="396.0" width="68.1" height="16" rx="3"/><text class="alabel mono blue" x="1030.0" y="408.0">down / up</text><rect class="lab" x="818.3" y="329.0" width="147.4" height="16" rx="3"/><text class="alabel mono " x="892.0" y="341.0">アラート受信 → ingest</text><rect class="lab" x="1264.1" y="249.0" width="35.8" height="16" rx="3"/><text class="alabel mono blue" x="1282.0" y="261.0">save</text><rect class="lab" x="1275.4" y="396.0" width="139.2" height="16" rx="3"/><text class="alabel mono blue" x="1345.0" y="408.0">on_open / on_resolve</text><rect class="lab" x="1194.4" y="519.0" width="71.2" height="16" rx="3"/><text class="alabel mono " x="1230.0" y="531.0">状態を読む</text><rect class="lab" x="1304.5" y="621.0" width="81.1" height="16" rx="3"/><text class="alabel mono blue" x="1345.0" y="633.0">HTML / JSON</text><rect class="lab" x="693.9" y="841.0" width="152.1" height="16" rx="3"/><text class="alabel mono " x="770.0" y="853.0">fetch / pull --ff-only</text><rect class="lab" x="1012.8" y="841.0" width="34.5" height="16" rx="3"/><text class="alabel mono " x="1030.0" y="853.0">起動</text><text class="hd" x="40" y="44" text-anchor="start">ToolOrchestrationHub — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助 / 監視だけ(ツールの権限は奪わない)。能動の確認は http_bridge だけで、あとは相手からの信号を待つ</text><text class="note" x="500" y="722" text-anchor="start">入口の検査: security.py(Host・Origin)・auth.py(API キー・役割)・audit.py(監査ログ)</text></svg>
