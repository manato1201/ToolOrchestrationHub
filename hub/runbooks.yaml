# hub/runbooks.yaml
#
# アラート種別ごとの運用手順書(IMPROVEMENT_PLAN_2026-10 H6)。やること / やらないこと / 成果物 を固定する。
# 初版の文面。運用してみて足りないところはこのファイルだけを書き換えればよい(Hubの再起動後に反映)。
# 種別の決め方は hub/runbooks.py の kind_for() を参照。
#
# Hubは「監視のみ・各ツールの権限は奪わない」ため、手順は「Hubから何かをする」ではなく
# 「人が確認・判断すること」だけを書く。

runbooks:
  liveness_down:
    title: "死活監視で停止を検知した"
    do:
      - "対象ツールのプロセス(CI系なら最新のワークフロー実行)が動いているかを確認する"
      - "ダッシュボードの「最終応答」で、最後に信号が届いた時刻を確認する"
      - "ハートビート系は /api/heartbeat/<tool_id>、CI系は /api/ci-success/<tool_id> へ通知が届いているかを確認する"
      - "復旧したらHubが自動で解消扱いにするのを待つ"
    dont:
      - "Hubから対象ツールへ接続・再起動を試みない(Hubは監視のみで、ツールの権限を持たない)"
      - "原因を確認する前にスヌーズして見えなくしない"
    deliverable:
      - "原因と復旧した時刻を1行で記録する"

  profiling_threshold:
    title: "プロファイリングのしきい値を超えた"
    do:
      - "ダッシュボードのプロファイリングで、該当ターゲットの最新の実行と前回の実行の差を確認する"
      - "超過したスパン/カウンタを特定し、直近の変更と照らし合わせる"
      - "一時的な負荷か、続いているかを次の実行で確かめる"
    dont:
      - "原因を確認する前に、しきい値を引き上げて通知を止めない"
    deliverable:
      - "超過した指標名・値・考えられる原因を記録する"

  visual_regression_failure:
    title: "視覚回帰テストが失敗した"
    do:
      - "成果物の評価結果(EvaluationResult)で、失敗したケースを確認する"
      - "意図した見た目の変更か、不具合かを判定する"
    dont:
      - "原因を確認せずに、期待値だけを書き換えて通さない"
    deliverable:
      - "失敗したケースID・判定(意図した変更 / 不具合)・対応を記録する"

  asset_insight_flag:
    title: "アセット診断で指摘があった"
    do:
      - "成果物の report_manifest.json で、指摘されたアセットと該当ルールを確認する"
      - "アセット側を直すか、ルールを見直すかを判断する"
    dont:
      - "指摘を消すためだけにルールを緩めない"
    deliverable:
      - "対象アセットと対応内容を記録する"

  generic:
    title: "その他のアラート"
    do:
      - "アラートの発生元(ツール)と内容を確認する"
      - "発生回数を確認し、再発しているなら原因を調べる"
    dont:
      - "内容を確認する前に、通知を止めない"
    deliverable:
      - "原因と対応を1行で記録する"
