# hub/repos.yaml
#
# ユーザー追加要件「gitの最新の状態を反映・差分ダウンロードという形で管理」の対象13リポジトリ。
# local_pathはこのリポジトリ(ToolOrchestrationHub)のルートからの相対パス。
# いずれもDesktop\GameDevelopment直下の兄弟フォルダとして既にクローン済み。
#
# Hubはここに載っているリポジトリに対して、読み取り専用のgit fetch(差分検知)を
# 定期実行するのみで、実際の取り込み(git pull)はダッシュボードの手動トリガでのみ行う。

repos:
  - repo_id: asset_data_insight_suite
    display_name: "AssetDataInsightSuite"
    local_path: "../AssetDataInsightSuite"
    remote_url: "https://github.com/manato1201/AssetDataInsightSuite.git"
    branch: main

